#
# Compile et teste sur Windows, Linux (x86-64 et ARM64) et macOS ; fabrique les archives portables.
# Un tag « v* » publie en plus une version GitHub avec les archives et leurs sommes SHA-256.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build-cmake -A x64
          cmake --build build-cmake --config Release
      # The program is a window application: PowerShell does not wait for it unless Start-Process -Wait is used,
      # and the hosted runners have no OpenGL 3.3 driver, so a software OpenGL (Mesa llvmpipe) is dropped next to it.
      - name: Software OpenGL for the tests (Mesa llvmpipe, not shipped)
        shell: pwsh
        run: |
          $v = "26.2.3"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$v/mesa3d-$v-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z "x64\*.dll" -omesa -y | Out-Null
          Copy-Item mesa\x64\*.dll bin\
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--selftest','--quiet' -Wait -PassThru -NoNewWindow
          Get-Content tests\report.txt
          if ($p.ExitCode -ne 0) { throw "self-test exit code $($p.ExitCode)" }
      - name: Output formats (ffmpeg download, each codec / container rendered and re-read)
        shell: pwsh
        run: |
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--get-ffmpeg','--quiet' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "ffmpeg download exit code $($p.ExitCode)" }
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--selftest','--quiet' -Wait -PassThru -NoNewWindow
          Get-Content tests\report.txt
          if ($p.ExitCode -ne 0) { throw "self-test exit code $($p.ExitCode)" }
      - name: Command line (--render, JSON progress, exit codes)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "cli"
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--render','--progress=json','--container=gif','--width=64','--height=64','--fps=10','--duration=0.5',"--outdir=$out",'tests\circle.glsl' -Wait -PassThru -NoNewWindow -RedirectStandardOutput cli.jsonl
          Get-Content cli.jsonl
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if (-not (Select-String -Path cli.jsonl -Pattern '"event":"end","ok":1,"failed":0' -Quiet)) { throw "no end event" }
          if (-not (Test-Path (Join-Path $out "circle.gif"))) { throw "no output" }
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--render','--bogus=1','tests\circle.glsl' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 2) { throw "usage exit code $($p.ExitCode)" }
      - name: Repository checks
        shell: pwsh
        run: ./scripts/check-repo.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*.zip

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xorg-dev libgl1-mesa-dev libgl1-mesa-dri xvfb libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Build
        run: ./scripts/build.sh -G Ninja
      - name: Self-test (Mesa software rendering)
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./scripts/test.sh
      - name: End-to-end (ffmpeg download, chunked and single renders, portability)
        run: |
          export HOME="$(mktemp -d)"
          bin/ShaderToMP4 --get-ffmpeg --quiet
          mkdir -p e2e
          for spec in "chunked 2 1" "single 1 0"; do
            set -- $spec
            {
              echo "// width=320"
              echo "// height=180"
              echo "// fps=30"
              echo "// duration=$2"
              echo "// chunk=$3"
              cat examples/plasma.glsl
            } > "e2e/$1.glsl"
          done
          xvfb-run -a -s "-screen 0 1280x800x24" bin/ShaderToMP4 --render e2e/chunked.glsl e2e/single.glsl
          for f in chunked single; do bin/ffmpeg -hide_banner -i "e2e/$f.mp4" 2>&1 | grep -E "Duration|Video:"; done
          test ! -d e2e/chunked.parts
          # every output format (H.264/H.265/VP9/AV1/ProRes/DNxHR, WebM, GIF, WebP, PNG/TIFF/EXR, 10-bit) rendered and re-read with ffmpeg
          xvfb-run -a -s "-screen 0 1280x800x24" bin/ShaderToMP4 --selftest --quiet
          cat tests/report.txt
          ! grep -E '^(SKIP|FAIL)' tests/report.txt
          # command line: JSON progress and exit codes
          xvfb-run -a -s "-screen 0 1280x800x24" bin/ShaderToMP4 --render --progress=json --container=gif --width=64 --height=64 --fps=10 --duration=0.5 --outdir=e2e/cli tests/circle.glsl | tee e2e/cli.jsonl
          grep -q '"event":"end","ok":1,"failed":0' e2e/cli.jsonl
          test -f e2e/cli/circle.gif
          code=0; bin/ShaderToMP4 --render --bogus=1 tests/circle.glsl || code=$?
          test "$code" -eq 2
          # watched folder: a shader dropped there is rendered, then the program stops (--watch-count)
          mkdir -p e2e/watch && cp tests/circle.glsl e2e/watch/
          xvfb-run -a -s "-screen 0 1280x800x24" bin/ShaderToMP4 --render --watch=e2e/watch --watch-count=1 --container=gif --width=64 --height=64 --fps=10 --duration=0.5
          test -f e2e/watch/circle.gif
          xvfb-run -a -s "-screen 0 1280x800x24" bin/ShaderToMP4 --diagnostic | tee e2e/diagnostic.txt
          grep -q "ffmpeg: ffmpeg version" e2e/diagnostic.txt
          xvfb-run -a -s "-screen 0 1280x800x24" bin/ShaderToMP4 --benchmark --seconds=1 --quick --json | tee e2e/benchmark.json
          grep -q '"results"' e2e/benchmark.json
          # portability: nothing may be created in the home folder (the graphics driver cache is tolerated)
          leftovers="$(find "$HOME" -mindepth 1 -not -path "$HOME/.cache*" | head)"
          test -z "$leftovers" || { echo "Files written outside the application folder:"; echo "$leftovers"; exit 1; }
      - name: Window screenshots
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1280x960x24" bin/ShaderToMP4 --screenshot shots/linux-main-en.png examples/*.glsl
          xvfb-run -a -s "-screen 0 1280x960x24" bin/ShaderToMP4 --screenshot-about shots/linux-about-en.png
          LC_ALL=fr_FR.UTF-8 xvfb-run -a -s "-screen 0 1280x960x24" bin/ShaderToMP4 --screenshot shots/linux-main-fr.png examples/*.glsl
          LC_ALL=fr_FR.UTF-8 xvfb-run -a -s "-screen 0 1280x960x24" bin/ShaderToMP4 --screenshot-about shots/linux-about-fr.png
      - name: Package
        run: ./scripts/package-linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux-${{ matrix.arch }}
          path: shots/*.png

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal arm64 + x86_64)
        run: ./scripts/build.sh -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Smoke test
        # Hosted macOS runners have no GPU (no OpenGL 3.3 pixel format): rendering is checked on Linux and Windows only.
        run: |
          lipo -info bin/ShaderToMP4
          bin/ShaderToMP4 --version
      - name: Package
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cd ..
          # guards: the tag must be the program version, and both changelogs must have a section for it
          version="${GITHUB_REF_NAME#v}"
          appver="$(sed -n 's/^#define APP_VER_STR "\(.*\)"/\1/p' src/app_info.h)"
          test "$appver" = "$version" || { echo "Tag v$version does not match APP_VER_STR $appver in src/app_info.h"; exit 1; }
          for f in CHANGELOG.md CHANGELOG.fr.md; do
            grep -q "^## $version" "$f" || { echo "$f has no section for $version"; exit 1; }
          done
          cat .github/release-notes.md .github/release-notes.fr.md > notes.md
          # the changelog section of this version (## <version> ...) is added to the notes
          version="${GITHUB_REF_NAME#v}"
          for f in CHANGELOG.md CHANGELOG.fr.md; do
            awk -v v="$version" '/^## /{p=index($0,"## " v)==1; next} p' "$f" >> notes.md || true
          done
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
            --title "ShaderToMP4 ${GITHUB_REF_NAME#v}" --notes-file notes.md
