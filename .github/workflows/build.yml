name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build-cmake -A x64
          cmake --build build-cmake --config Release
      - name: Self-test
        run: bin\ShaderToMP4.exe --selftest --quiet
      - name: Repository checks
        shell: pwsh
        run: ./scripts/check-repo.ps1

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libgl1-mesa-dri xvfb libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Build
        run: |
          cmake -S . -B build-cmake -G Ninja
          cmake --build build-cmake
      - name: Self-test (Mesa software rendering)
        run: xvfb-run -a -s "-screen 0 1280x800x24" bin/ShaderToMP4 --selftest --quiet
      - name: Window screenshots
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1280x960x24" bin/ShaderToMP4 --screenshot shots/linux-main.png examples/*.glsl
          xvfb-run -a -s "-screen 0 1280x960x24" bin/ShaderToMP4 --screenshot-about shots/linux-about.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: shots/*.png

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build-cmake -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-cmake
      - name: Smoke test
        # Hosted macOS runners have no GPU (no OpenGL 3.3 pixel format): rendering is checked on Linux and Windows only.
        run: |
          lipo -info bin/ShaderToMP4
          bin/ShaderToMP4 --version
