#
# Compile, teste et empaquette Windows seulement (Linux et macOS sont gelés depuis le 2026-10-22 : plus de tâche pour eux ;
# leur code reste dans le dépôt, la dernière version publiée avec eux est la 2.1.1).
# Un tag « v* » publie en plus une version GitHub avec les archives et leurs sommes SHA-256.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build-cmake -A x64
          cmake --build build-cmake --config Release
      # The program is a window application: PowerShell does not wait for it unless Start-Process -Wait is used,
      # and the hosted runners have no OpenGL 3.3 driver, so a software OpenGL (Mesa llvmpipe) is dropped next to it.
      - name: Software OpenGL for the tests (Mesa llvmpipe, not shipped)
        shell: pwsh
        run: |
          $v = "26.2.3"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$v/mesa3d-$v-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z "x64\*.dll" -omesa -y | Out-Null
          Copy-Item mesa\x64\*.dll bin\
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--selftest','--quiet' -Wait -PassThru -NoNewWindow
          Get-Content tests\report.txt
          Select-String -Path tests\report.txt -Pattern '^DRIFT' | ForEach-Object { Write-Host "::warning::$($_.Line)" }   # close to the tolerance: an alert, not a silent pass
          if ($p.ExitCode -ne 0) { throw "self-test exit code $($p.ExitCode)" }
      - name: Output formats (ffmpeg download, each codec / container rendered and re-read)
        shell: pwsh
        run: |
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--get-ffmpeg','--quiet' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "ffmpeg download exit code $($p.ExitCode)" }
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--selftest','--quiet' -Wait -PassThru -NoNewWindow
          Get-Content tests\report.txt
          Select-String -Path tests\report.txt -Pattern '^DRIFT' | ForEach-Object { Write-Host "::warning::$($_.Line)" }   # close to the tolerance: an alert, not a silent pass
          if ($p.ExitCode -ne 0) { throw "self-test exit code $($p.ExitCode)" }
      - name: Command line (--render, JSON progress, exit codes)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "cli"
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--render','--progress=json','--container=gif','--width=64','--height=64','--fps=10','--duration=0.5',"--outdir=$out",'tests\circle.glsl' -Wait -PassThru -NoNewWindow -RedirectStandardOutput cli.jsonl
          Get-Content cli.jsonl
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if (-not (Select-String -Path cli.jsonl -Pattern '"event":"end","ok":1,"failed":0' -Quiet)) { throw "no end event" }
          if (-not (Test-Path (Join-Path $out "circle.gif"))) { throw "no output" }
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--render','--bogus=1','tests\circle.glsl' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 2) { throw "usage exit code $($p.ExitCode)" }
      - name: Benchmark (every case, then comparison with the first run, drop limit 40 %)
        shell: pwsh
        run: |
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--benchmark','--quick','--full','--seconds=1','--json' -Wait -PassThru -NoNewWindow -RedirectStandardOutput bench-ref.json
          if ($p.ExitCode -ne 0) { throw "benchmark exit code $($p.ExitCode)" }
          Get-Content bench-ref.json
          $p = Start-Process bin\ShaderToMP4.exe -ArgumentList '--benchmark','--quick','--full','--seconds=1','--compare=bench-ref.json','--max-drop=40' -Wait -PassThru -NoNewWindow -RedirectStandardOutput bench-cmp.txt
          Get-Content bench-cmp.txt
          if ($p.ExitCode -ne 0) { throw "benchmark regression or error, exit code $($p.ExitCode)" }
      # Memory errors: the program is built with Visual Studio's AddressSanitizer (/fsanitize=address, scripts/build-asan.bat) and the complete self-test must
      # pass with no alert; the fuzzing of the file readers runs inside it (the self-test restarts the program in --fuzz mode)
      - name: AddressSanitizer build and complete self-test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $env:VCVARSALL = "$vs\VC\Auxiliary\Build\vcvars64.bat"
          cmd /c scripts\build-asan.bat
          if ($LASTEXITCODE -ne 0) { throw "AddressSanitizer build failed" }
          Copy-Item mesa\x64\*.dll bin-asan\
          cmd /c scripts\test-asan.bat
          if ($LASTEXITCODE -ne 0) { throw "AddressSanitizer found a problem or the self-test failed" }
      - name: Repository checks
        shell: pwsh
        run: ./scripts/check-repo.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      # Optional installer: NSIS from Chocolatey (the package checks the installer checksum), pinned ffmpeg checked by SHA-256 in the script
      - name: Installer (NSIS, ffmpeg included) and its checks
        shell: pwsh
        run: |
          choco install nsis --version=3.11 -y --no-progress
          ./scripts/package-installer.ps1
          ./scripts/verify-installer.ps1 -SkipRender
      # Trust files published with the version: software bill of materials (SPDX), known vulnerabilities of the third-party components (NVD),
      # winget and Scoop manifests built from the files of the version
      - name: SBOM, vulnerability check, winget and Scoop manifests
        shell: pwsh
        run: |
          ./scripts/make-sbom.ps1
          ./scripts/check-vulnerabilities.ps1   # the report is published as it is; a base that cannot be reached must not stop a release
          if ($LASTEXITCODE -ne 0) { Write-Warning "vulnerability base not reachable (exit $LASTEXITCODE): see the report"; $global:LASTEXITCODE = 0 }
          ./scripts/package-manifests.ps1
          $v = (Select-String -Path src\app_info.h -Pattern '^#define APP_VER_STR "(.*)"').Matches[0].Groups[1].Value
          Compress-Archive -Path dist\manifests\* -DestinationPath "dist\ShaderToMP4-$v-manifests.zip"
      # Performance journal published with the version (benchmark, opening time, memory and duration of a reference render), compared with the journal of the previous
      # release: a regression of more than 15 % stops the release (on a tag; on other pushes it is a warning, runners vary). Skipped when the machine differs.
      - name: Performance journal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prev | Out-Null
          gh release download --pattern '*-perf.json' --dir prev 2>$null
          $prev = Get-ChildItem prev -Filter *-perf.json -ErrorAction SilentlyContinue | Select-Object -First 1
          ./scripts/perf-journal.ps1 -Previous $(if ($prev) { $prev.FullName } else { "" })
          if ($LASTEXITCODE -ne 0) {
            if ($env:GITHUB_REF -like 'refs/tags/v*') { throw "performance regression of more than 15 % (see the journal above)" }
            Write-Warning "performance regression of more than 15 % (warning only outside a release tag)"
            $global:LASTEXITCODE = 0
          }
      # Two builds of the same commit in the same folder must give the same bytes (linker option /Brepro); this step rebuilds bin\ShaderToMP4.exe, so it comes last
      - name: Reproducible build
        shell: pwsh
        run: ./scripts/verify-reproducible.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*-sbom.spdx.json
            dist/*-vulnerabilities.txt
            dist/*-perf.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip *-setup.exe > SHA256SUMS.txt
          cd ..
          # guards: the tag must be the program version, and both changelogs must have a section for it
          version="${GITHUB_REF_NAME#v}"
          appver="$(sed -n 's/^#define APP_VER_STR "\(.*\)"/\1/p' src/app_info.h)"
          test "$appver" = "$version" || { echo "Tag v$version does not match APP_VER_STR $appver in src/app_info.h"; exit 1; }
          for f in CHANGELOG.md CHANGELOG.fr.md; do
            grep -q "^## $version" "$f" || { echo "$f has no section for $version"; exit 1; }
          done
          cat .github/release-notes.md .github/release-notes.fr.md > notes.md
          # the changelog section of this version (## <version> ...) is added to the notes
          version="${GITHUB_REF_NAME#v}"
          for f in CHANGELOG.md CHANGELOG.fr.md; do
            awk -v v="$version" '/^## /{p=index($0,"## " v)==1; next} p' "$f" >> notes.md || true
          done
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*-setup.exe dist/SHA256SUMS.txt dist/*-sbom.spdx.json dist/*-vulnerabilities.txt dist/*-perf.json \
            --title "ShaderToMP4 ${GITHUB_REF_NAME#v}" --notes-file notes.md
