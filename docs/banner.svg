<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ShaderToMP4">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121F"/>
      <stop offset="1" stop-color="#0B0D14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A96"/>
      <stop offset="1" stop-color="#465AFF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9CEFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A96" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5A96" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#465AFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#465AFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1280" height="340" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <circle cx="1060" cy="60" r="330" fill="url(#glowB)"/>
    <circle cx="1210" cy="300" r="260" fill="url(#glowA)"/>
    <circle cx="120" cy="330" r="220" fill="url(#glowA)" opacity="0.5"/>
    <!-- ondes decoratives -->
    <g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35">
      <path d="M700 250 C 800 170, 900 330, 1000 250 S 1200 170, 1300 250"/>
      <path d="M700 270 C 800 190, 900 350, 1000 270 S 1200 190, 1300 270" opacity="0.7"/>
      <path d="M700 290 C 800 210, 900 370, 1000 290 S 1200 210, 1300 290" opacity="0.45"/>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="338" rx="27" fill="none" stroke="#2A2F3D" stroke-width="2"/>

  <!-- logo -->
  <g transform="translate(70 78)">
    <rect width="110" height="110" rx="28" fill="url(#accent)"/>
    <path d="M44 32 L82 55 L44 78 Z" fill="#FFFFFF"/>
  </g>

  <!-- titre -->
  <text x="212" y="140" font-family="'Segoe UI Semibold','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="url(#title)">ShaderToMP4</text>
  <text x="214" y="184" font-family="'Segoe UI','Segoe UI Variable',-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#9AA3BA">Transforme un shader Shadertoy en vidéo, image par image.</text>

  <!-- pastilles -->
  <g font-family="'Segoe UI','Segoe UI Variable',-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#D6DAEA">
    <g transform="translate(70 238)">
      <rect width="160" height="42" rx="21" fill="#1B1F2A" stroke="#2D3342"/>
      <text x="80" y="27" text-anchor="middle">Temps exact</text>
    </g>
    <g transform="translate(246 238)">
      <rect width="190" height="42" rx="21" fill="#1B1F2A" stroke="#2D3342"/>
      <text x="95" y="27" text-anchor="middle">4K · 60 images/s</text>
    </g>
    <g transform="translate(452 238)">
      <rect width="214" height="42" rx="21" fill="#1B1F2A" stroke="#2D3342"/>
      <text x="107" y="27" text-anchor="middle">Flou de mouvement</text>
    </g>
    <g transform="translate(682 238)">
      <rect width="248" height="42" rx="21" fill="#1B1F2A" stroke="#2D3342"/>
      <text x="124" y="27" text-anchor="middle">Reprise après coupure</text>
    </g>
  </g>
</svg>
